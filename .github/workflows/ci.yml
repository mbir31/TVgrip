name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|Caused by|Unresolved|Cannot|Incompatible|actual type|No value passed|not applicable" /tmp/build.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit $rc
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
