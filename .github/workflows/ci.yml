name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate CI release key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/tvgrip-ci-upload.jks" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=TVGrip CI, OU=CI, O=TVGrip, L=Dhaka, ST=Dhaka, C=BD"
          echo "Generated CI release keystore."

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|Caused by|Unresolved|Cannot|Incompatible|actual type|No value passed|not applicable" /tmp/build.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit $rc
          fi

      - name: Build release APK (R8 minify)
        run: |
          set +e
          export KEYSTORE_PATH="$HOME/.android/tvgrip-ci-upload.jks"
          export STORE_PASSWORD=android
          export KEY_PASSWORD=android
          gradle :app:assembleRelease --stacktrace --no-daemon > /tmp/release.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|Caused by|Unresolved|Cannot|Incompatible|missing|not found|Missing" /tmp/release.log | head -n 50 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 50 /tmp/release.log
            exit $rc
          fi

      - name: Run unit tests
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace --no-daemon > /tmp/test.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "FAILED|expected:|but was:|AssertionError|Tests with failures|> There were|e: |error:" /tmp/test.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 40 /tmp/test.log
            exit $rc
          fi

      - name: Run lint
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --no-daemon > /tmp/lint.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "Lint found|error:|Error:|Unresolved|> Task :app:lint|FAILURE|Caused by" /tmp/lint.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 40 /tmp/lint.log
            exit $rc
          fi

      - name: Compile instrumented tests
        run: |
          set +e
          gradle :app:assembleDebugAndroidTest --stacktrace --no-daemon > /tmp/androidtest.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "^e: |error:|FAILURE|Caused by|Unresolved|Cannot|Incompatible|actual type|missing" /tmp/androidtest.log | head -n 50 | while IFS= read -r line; do echo "::error::${line}"; done
            exit $rc
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
