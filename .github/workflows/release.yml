name: Build & Release TVGrip APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Compile & Publish TVGrip APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating debug signing keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=TVGrip Debug,O=TVGrip,C=US"
          fi

      - name: Build Installable Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage Release Binary
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/TVGrip.apk
          ls -la release_output/TVGrip.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip-Release-APK
          path: release_output/TVGrip.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('TVGrip Release {0}', github.ref_name) || 'TVGrip Latest Release' }}
          body: |
            ### 📺 TVGrip APK Direct Download
            - **Build Commit:** `${{ github.sha }}`
            - **Updated:** ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **Features:** Android TV Remote v2, Mutual TLS PIN Pairing, Bluetooth HID Remote, Air Mouse, 4-Player Gamepad, Voice Search.

            ⬇️ Download and install **`TVGrip.apk`** on your Android device.
          files: release_output/TVGrip.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
