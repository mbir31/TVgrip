name: Build & Release TVGrip APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/TVGrip.apk
          echo "APK prepared at release_assets/TVGrip.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip-APK
          path: release_assets/TVGrip.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If pushed with a tag (e.g. v1.0.0), use that tag. Otherwise use a rolling 'latest' release tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="TVGrip Release ${TAG_NAME}"
          else
            TAG_NAME="latest"
            RELEASE_TITLE="TVGrip Latest Build"
          fi
          
          echo "Target Release Tag: $TAG_NAME"
          
          # Delete existing release & tag with this name if it's the rolling 'latest' tag
          if [[ "$TAG_NAME" == "latest" ]]; then
            gh release delete latest --yes || true
            git push --delete origin latest || true
          fi
          
          gh release create "$TAG_NAME" \
            release_assets/TVGrip.apk#TVGrip.apk \
            --title "$RELEASE_TITLE" \
            --notes "### 📺 TVGrip Android TV Remote APK
Direct download for installable APK.
- **Commit:** \`${{ github.sha }}\`
- **Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

Download \`TVGrip.apk\` below to install directly on your Android phone." \
            --latest
