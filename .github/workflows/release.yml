name: Build & Release TVGrip APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Compile & Publish TVGrip APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating signing keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=TVGrip Debug,O=TVGrip,C=US"
          fi

      - name: Build Installable Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage Release Binary
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/TVGrip.apk
          ls -la release_output/TVGrip.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip-Release-APK
          path: release_output/TVGrip.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="TVGrip Release ${TAG_NAME}"
          else
            TAG_NAME="latest"
            RELEASE_TITLE="TVGrip Latest Release"
          fi

          echo "Target Release Tag: $TAG_NAME"

          if [[ "$TAG_NAME" == "latest" ]]; then
            gh release delete latest --yes || true
            git push --delete origin latest || true
          fi

          NOTES="### 📺 TVGrip APK Direct Download
          - Build Commit: ${{ github.sha }}
          - Features: Android TV Remote v2, Mutual TLS PIN Pairing, Bluetooth HID Remote, Air Mouse, 4-Player Gamepad, Voice Search.

          Download and install TVGrip.apk on your Android phone."

          gh release create "$TAG_NAME" release_output/TVGrip.apk --title "$RELEASE_TITLE" --notes "$NOTES" --latest
