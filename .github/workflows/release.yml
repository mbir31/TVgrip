name: Release TVGrip APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating build debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare Release Asset
        id: prepare
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Expected APK not found at $APK_SRC"
            exit 1
          fi
          mkdir -p release-binaries
          cp "$APK_SRC" release-binaries/TVGrip.apk
          echo "tag_name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "release_title=TVGrip v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGrip.apk
          path: release-binaries/TVGrip.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag_name }}
          name: ${{ steps.prepare.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-binaries/TVGrip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
